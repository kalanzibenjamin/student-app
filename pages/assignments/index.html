<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignments | Student Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/src/scss/main.scss">
</head>
<body class="student-portal-page" data-page="student-assignments">
  <div class="student-layout">
    <div data-student-navigation></div>
    <div class="student-main">
      <header class="student-topbar">
        <h1>Assignments</h1>
        <a class="student-notification-link" href="/pages/notifications/" aria-label="Notifications">
          <i class="fas fa-bell" aria-hidden="true"></i>
          <span class="student-notification-count" data-count="0" hidden>0</span>
        </a>
      </header>
      <main class="student-content student-page">
        <section class="assignment-toolbar" aria-label="Assignment filters">
          <button type="button" class="is-active" data-assignment-filter="all">All</button>
          <button type="button" data-assignment-filter="pending">Pending</button>
          <button type="button" data-assignment-filter="submitted">Submitted</button>
          <button type="button" data-assignment-filter="overdue">Overdue</button>
        </section>

        <section class="assignment-list" data-assignment-list>
          <article class="assignment-card" data-assignment-status="pending">
            <div class="assignment-card__status assignment-card__status--pending"><i class="fas fa-clock"></i><span>Pending</span></div>
            <div class="assignment-card__main"><span class="assignment-card__code">CSN 2101</span><h2>Subnetting report</h2><p>Computer Networks</p></div>
            <div class="assignment-card__due"><span>Due</span><strong>28 Nov, 23:59</strong></div>
            <button type="button" class="assignment-card__action">Open</button>
          </article>
          <article class="assignment-card" data-assignment-status="submitted">
            <div class="assignment-card__status assignment-card__status--submitted"><i class="fas fa-check"></i><span>Submitted</span></div>
            <div class="assignment-card__main"><span class="assignment-card__code">DBS 2301</span><h2>SQL design practical</h2><p>Database Systems</p></div>
            <div class="assignment-card__due"><span>Submitted</span><strong>21 Nov, 18:42</strong></div>
            <button type="button" class="assignment-card__action">View</button>
          </article>
          <article class="assignment-card" data-assignment-status="overdue">
            <div class="assignment-card__status assignment-card__status--overdue"><i class="fas fa-triangle-exclamation"></i><span>Overdue</span></div>
            <div class="assignment-card__main"><span class="assignment-card__code">SWE 2202</span><h2>Requirements document</h2><p>Software Engineering</p></div>
            <div class="assignment-card__due"><span>Due</span><strong>18 Nov, 23:59</strong></div>
            <button type="button" class="assignment-card__action">Open</button>
          </article>
        </section>
      </main>
    </div>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
  <script type="module" src="/src/js/app-main.js"></script>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
